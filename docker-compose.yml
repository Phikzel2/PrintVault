version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stlibrary}
      POSTGRES_USER: ${POSTGRES_USER:-stlibrary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stlibrary}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stlibrary}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stlibrary}:${POSTGRES_PASSWORD:-stlibrary}@db:5432/${POSTGRES_DB:-stlibrary}
      UPLOAD_DIR: /data/uploads
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
